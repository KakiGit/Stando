[package]
name = "stando"
version = "0.1.0"
edition = "2021"
authors = ["Stando Contributors"]
description = "A next-gen selection based search system for Linux"
license = "MIT"

[dependencies]
# GTK4 and UI
gtk4 = { version = "0.10", package = "gtk4" }
adw = { version = "0.8.1", package = "libadwaita" }
gdk4 = { version = "0.10", package = "gdk4" }
gio = { version = "0.21", package = "gio" }
glib = { version = "0.21", package = "glib" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client for OpenAI API
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# XDG directories
xdg = "2.5"

# File system traversal
walkdir = "2.5"
jwalk = "0.8"

# Fuzzy matching
fuzzy-matcher = "0.3"

# Global hotkeys
global-hotkey = "0.5"
winit = "0.30"

# Desktop file parsing
desktop = "1.0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Command-line argument parsing
clap = { version = "4.5", features = ["derive"] }

# Async channels
tokio-stream = "0.1"

# Futures
futures = "0.3"

# Open files/URLs
open = "5.0"

[build-dependencies]
pkg-config = "0.3"
