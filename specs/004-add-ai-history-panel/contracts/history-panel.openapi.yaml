openapi: 3.0.3
info:
  title: AI History Panel Data Contract
  version: 0.1.0
  description: |
    Defines the internal endpoints that drive the AI history panel UI: listing entries,
    selecting rows, and appending new messages so the left-hand detail pane stays synchronized.
servers:
  - url: "https://internal.stando.local"
    description: Internal UI synchronization endpoint (implementation detail only)
paths:
  /ai/history:
    get:
      summary: Retrieve the chronological chat history for the AI panel
      description: Returns all persisted entries so the right-hand list can render metadata and the detail view can show the current selection.
      responses:
        '200':
          description: Current history snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'
  /ai/history/select:
    post:
      summary: Update the selected entry
      description: Called when the user clicks a list row or presses Up/Down; the detail pane must show the selected content immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionRequest'
      responses:
        '200':
          description: Selected entry metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionResponse'
  /ai/history/append:
    post:
      summary: Append a new history entry
      description: Used by background AI/user workflows to add prompts or replies. The panel auto-selects the newest entry and scrolls the list if needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatHistoryEntry'
      responses:
        '201':
          description: Entry appended successfully
components:
  schemas:
    ChatHistoryEntry:
      type: object
      required:
        - id
        - timestamp
        - role
        - summary
        - content
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the entry
        timestamp:
          type: string
          format: date-time
          description: When the message was recorded (ISO-8601)
        role:
          type: string
          enum: [user, assistant]
          description: Who authored the message in the conversation
        summary:
          type: string
          description: Short label shown in the list (timestamp or role + summary)
        content:
          type: string
          description: Full text rendered in the left-hand detail view
        source:
          type: string
          description: Optional source tag ("prompt" or "response")
    HistoryListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ChatHistoryEntry'
        selectedId:
          type: string
          format: uuid
          nullable: true
      description: Snapshot of the panel state, ordered chronologically (oldest first).
    SelectionRequest:
      type: object
      required:
        - entryId
      properties:
        entryId:
          type: string
          format: uuid
          description: Entry that should become selected (user choice or arrow navigation)
    SelectionResponse:
      type: object
      properties:
        selectedEntry:
          $ref: '#/components/schemas/ChatHistoryEntry'
        visibleStart:
          type: integer
          description: Start index of the entries currently in view (for auto-scrolling)
        visibleEnd:
          type: integer
          description: End index (inclusive)
