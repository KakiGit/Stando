openapi: 3.1.0
info:
  title: AI Conversation Append
  version: 0.1.0
  summary: Contract describing the AI input submission flow that appends a message to an existing conversation.
paths:
  /ai/chats/{chatId}/messages:
    post:
      summary: Append user input to an existing chat
      description: Applies the requirements from FR-002, FR-005, and FR-006 by ensuring the chat exists (selected or automatically created for the first submission), rejecting empty submissions, and persisting the message.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: Identifier of the currently selected chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Trimmed text the user entered in AI mode.
              required:
                - content
      responses:
        '201':
          description: Message appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid submission (empty content or no chat selected)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    Message:
      type: object
      properties:
        id:
          type: string
        chat_id:
          type: string
        author:
          type: string
          enum: [user, ai]
        content:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - chat_id
        - author
        - content
        - timestamp
