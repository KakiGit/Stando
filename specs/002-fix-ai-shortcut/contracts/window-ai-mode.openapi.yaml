openapi: 3.0.3
info:
  title: Window AI Mode Contract
  version: 1.0.0
  description: |
    Conceptual contract for window-local AI mode switching actions.
    This is an internal, in-process action surface (no external network API).
paths:
  /windows/{window_id}/ai-mode:
    get:
      summary: Get the AI mode for a window
      parameters:
        - name: window_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current AI mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModeState"
  /windows/{window_id}/ai-mode/toggle:
    post:
      summary: Toggle AI mode for a window
      parameters:
        - name: window_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated AI mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModeState"
components:
  schemas:
    AiModeState:
      type: object
      required:
        - window_id
        - ai_mode
      properties:
        window_id:
          type: string
        ai_mode:
          type: string
          description: Current AI mode identifier
